[project]
name = "cfcoach"
version = "0.1.0"
description = "Simple util to analyze your codeforces activity to recommend you tasks"
authors = [
    {name = "andreyfesunov",email = "fsnv04@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "oic (>=1.7.0,<2.0.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "toml (>=0.10.2,<0.11.0)",
    "fastapi (>=0.128.0,<0.129.0)",
    "pyjwt (>=2.9.0,<3.0.0)",
    "aiosqlite (>=0.20.0,<1.0.0)",
    "uvicorn (>=0.32.0,<1.0.0)",
    "jwt (>=1.4.0,<2.0.0)",
    "httpx (>=0.27.0,<1.0.0)",
    "jinja2 (>=3.1.0,<4.0.0)",
    "python-multipart (>=0.0.21,<0.0.22)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
